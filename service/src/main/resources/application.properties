spring.application.name=helloworld

# muss bereits zur Build-Zeit gesetzt sein: spring-boot:process-aot baekt die
# Entscheidung "eigener Management-Webserver auf separatem Port" als Bean-Definition
# fest ein. Wird der Port erst zur Laufzeit ueber die ConfigMap (SPRING_CONFIG_ADDITIONAL_LOCATION)
# gesetzt, kommt das zu spaet und Actuator laeuft dann faelschlich auf server.port (8080).
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus

# NEU: Virtual Threads fuer Tomcat-Request-Verarbeitung (JDK 21+, Pinning bei
# synchronized seit JDK 24 behoben, JEP 491). Muss wie management.server.port
# bereits zur Build-Zeit gesetzt sein: @ConditionalOnThreading wird von
# spring-boot:process-aot ausgewertet und festgeschrieben. In der ConfigMap
# (SPRING_CONFIG_ADDITIONAL_LOCATION) waere die Einstellung wirkungslos.
spring.threads.virtual.enabled=true
