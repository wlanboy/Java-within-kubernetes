{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "hello-world-hpa.fullname" . }}
  labels:
    {{- include "hello-world-hpa.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "hello-world-hpa.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.cpu.enabled }}
    # Resource-Metrik ueber metrics.k8s.io (metrics-server) - sofort ohne weitere
    # Cluster-Komponenten nutzbar.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.cpu.targetAverageUtilization }}
    {{- end }}
    {{- if .Values.autoscaling.requestsMetric.enabled }}
    # Custom Metric ueber die Kubernetes custom.metrics.k8s.io API (Prometheus Adapter),
    # gemessen am istio-ingressgateway (nicht an den App-Pods!) und dem Service
    # "hello-world-hpa" zugeordnet. Object-Metrik statt Pods-Metrik, weil eine
    # Pods-Metrik bei 0 Replicas nicht existieren kann (kein Pod zum Scrapen) und
    # damit fuer minReplicas: 0 von Kubernetes nicht zugelassen ist. Die
    # Gateway-Metrik existiert dagegen unabhaengig von laufenden Pods, sodass der
    # HPA von 0 wieder hochskalieren kann.
    - type: Object
      object:
        metric:
          name: {{ .Values.autoscaling.requestsMetric.name }}
        describedObject:
          apiVersion: v1
          kind: Service
          name: {{ include "hello-world-hpa.fullname" . }}
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.requestsMetric.targetAverageValue | quote }}
    {{- end }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleUp.stabilizationWindowSeconds }}
      policies:
        - type: Pods
          value: {{ .Values.autoscaling.behavior.scaleUp.podsPerPeriod }}
          periodSeconds: {{ .Values.autoscaling.behavior.scaleUp.periodSeconds }}
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleDown.stabilizationWindowSeconds }}
      policies:
        - type: Pods
          value: {{ .Values.autoscaling.behavior.scaleDown.podsPerPeriod }}
          periodSeconds: {{ .Values.autoscaling.behavior.scaleDown.periodSeconds }}
{{- end }}
