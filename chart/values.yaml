nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  repository: wlanboy/helloworld
  tag: latest
  pullPolicy: Always

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/actuator/prometheus"
  # NEU: Istio-Sidecar als nativen Sidecar (initContainer mit restartPolicy:
  # Always, Kubernetes >= 1.29) injizieren. Kubernetes startet ihn garantiert
  # VOR dem App-Container und beendet ihn erst NACH ihm. Ohne das kann die App
  # beim Start Requests senden, bevor Envoy bereit ist, und beim Shutdown
  # (preStop + graceful shutdown) ist Envoy evtl. schon weg.
  sidecar.istio.io/nativeSidecar: "true"
  # NEU: Fallback fuer Cluster/Istio-Versionen ohne native Sidecars: App-Container
  # erst starten, wenn Envoy ready ist (bei nativem Sidecar ohnehin implizit)
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'

terminationGracePeriodSeconds: 40
automountServiceAccountToken: false

podAntiAffinity:
  enabled: true
  weight: 100

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

ports:
  http: 8080
  management: 8081

env:
  TZ: "Europe/Berlin"
  SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/config/"

# NEU: -Djava.security.egd=file:/dev/./urandom entfernt (seit JDK 9 wirkungslos,
#      SecureRandom blockiert unter Linux ohnehin nicht mehr, siehe readme.md)
# NEU: -XX:+UseCompactObjectHeaders (JEP 519): 8 statt 12 Byte Objekt-Header,
#      weniger Heap-Verbrauch. Muss zum AOT-Cache-Trainingslauf im Dockerfile
#      passen (ebenso -XX:+UseSerialGC), sonst verwirft die JVM den Cache.
# NEU: -XX:NativeMemoryTracking=summary: macht den gesamten JVM-Speicher
#      (Heap + Metaspace + Code-Cache + Threads + GC + ...) per
#      "jcmd 1 VM.native_memory summary" messbar, Grundlage fuer resources.memory
#      (siehe readme.md "Speicher messen"). Kostet ca. 1-2 % Speicher und etwas
#      CPU, nach der Messung kann es wieder raus.
javaOpts: >-
  -XX:+ExitOnOutOfMemoryError
  -XX:MaxRAMPercentage=70.0
  -XX:InitialRAMPercentage=70.0
  -XX:MaxMetaspaceSize=96m
  -XX:MaxDirectMemorySize=32m
  -XX:-UsePerfData
  -XX:+UseSerialGC
  -XX:+UseCompactObjectHeaders
  -XX:NativeMemoryTracking=summary
  -XX:ActiveProcessorCount=1
  -XX:TieredStopAtLevel=1
  -Dspring.aot.enabled=true

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
    ephemeral-storage: "128Mi"
  limits:
    cpu: "1"
    memory: "512Mi"
    ephemeral-storage: "256Mi"

startupProbe:
  path: /actuator/health/readiness
  port: management
  failureThreshold: 30
  periodSeconds: 2
  timeoutSeconds: 5

readinessProbe:
  path: /actuator/health/readiness
  port: management
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

livenessProbe:
  path: /actuator/health/liveness
  port: management
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

preStopSleepSeconds: 5

# NEU: Obergrenze fuer das /tmp-emptyDir (Tomcat-Work-Dir, JVM-Attach-Socket fuer jcmd)
tmpSizeLimit: 64Mi

# PodDisruptionBudget: begrenzt, wie viele Pods bei freiwilligen Disruptions
# (Node-Drain, Cluster-Autoscaler-Downscale, kubectl evict) gleichzeitig
# entfernt werden duerfen. Schuetzt NICHT vor Pod-Crashes/OOM-Kills, nur vor
# absichtlichen/geplanten Aktionen.
# Achtung: minAvailable muss kleiner als replicaCount sein - bei
# minAvailable == replicaCount (z.B. beide = 1) wird jede freiwillige
# Disruption blockiert, weil das Entfernen des letzten verfuegbaren Pods das
# Budget verletzen wuerde. Bei replicaCount: 1 daher enabled: false lassen
# oder replicaCount erhoehen.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # NEU: Pods, die nicht Ready sind (z.B. CrashLoopBackOff), duerfen immer
  # evicted werden. Mit dem Default (IfHealthyBudget) blockiert ein kaputter Pod
  # jeden Node-Drain, obwohl er ohnehin keinen Traffic bedient (GA seit K8s 1.31).
  unhealthyPodEvictionPolicy: AlwaysAllow

# application.properties Inhalt fuer die ConfigMap (siehe manifests/configmap.yaml)
config: |
  # --- Server ---
  server.shutdown=graceful
  server.http2.enabled=true

  # --- Tomcat
  # NEU: server.tomcat.threads.max=20 und server.tomcat.threads.min-spare=5 entfernt.
  # Mit spring.threads.virtual.enabled=true (in src/main/resources/application.properties,
  # muss wegen Spring AOT zur Build-Zeit gesetzt sein) laeuft jeder Request auf einem
  # eigenen Virtual Thread, der Tomcat-Worker-Pool wird nicht mehr genutzt und beide
  # Werte waeren wirkungslos. Die Nebenlaeufigkeit begrenzt jetzt max-connections.
  # server.tomcat.max-connections=8192 (Default)
  server.tomcat.max-connections=512
  # Anzahl der Requests, die in die Warteschlange duerfen, bevor Verbindungen abgelehnt werden
  server.tomcat.accept-count=100
  # Anzahl der Processor-Objekte, die Tomcat zur Wiederverwendung vorhaelt (Default: 200)
  server.tomcat.processor-cache=200

  # --- Timeouts: kurz halten, damit offene Keep-Alive-Verbindungen den graceful shutdown
  # (preStop-sleep von nur 5s, siehe Deployment) nicht verzoegern
  # server.tomcat.connection-timeout=20s (Default)
  server.tomcat.connection-timeout=5s
  server.tomcat.keep-alive-timeout=15s
  # Begrenzt Requests pro Keep-Alive-Verbindung (Default: 100). Bei nur 2 Replicas
  # sorgt ein niedrigerer Wert fuer periodische Reconnects, damit eine einzelne
  # lang gehaltene Verbindung nicht dauerhaft denselben Pod bindet
  server.tomcat.max-keep-alive-requests=50

  # --- Hinter dem Istio-Sidecar: X-Forwarded-* Header vom Spring-Framework auswerten lassen,
  # damit Client-IP/Schema/Host in Logs und generierten URLs korrekt ankommen
  server.forward-headers-strategy=framework

  # --- JMX-Registrierung der Tomcat-MBeans abschalten: spart etwas Startzeit/Speicher,
  # da kein JMX-Monitoring genutzt wird (Metriken laufen ueber Actuator/Prometheus)
  server.tomcat.mbeanregistry.enabled=false

  # --- Graceful shutdown: Zeitfenster muss zum terminationGracePeriodSeconds im Deployment passen ---
  spring.lifecycle.timeout-per-shutdown-phase=30s

  # --- Actuator auf eigenem Port: Health/Metrics/Prometheus sind damit nicht ueber
  # den Kubernetes-Service/Istio erreichbar, sondern nur direkt auf dem Pod (Probes
  # und Prometheus-Scrape gehen an der Pod-IP vorbei am Service) ---
  management.server.port=8081

  # --- Actuator: fuer Kubernetes Liveness-/Readiness-Probes ---
  management.endpoints.web.exposure.include=health,info,prometheus
  management.endpoint.health.probes.enabled=true
  management.health.livenessstate.enabled=true
  management.health.readinessstate.enabled=true
  # verhindert, dass interne Detail-Infos (DB-Status, Disk-Space etc.) ueber
  # /actuator/health nach aussen sichtbar werden, falls der Endpoint doch erreichbar ist
  management.endpoint.health.show-details=never
  # taggt alle Prometheus-Metriken mit dem App-Namen, damit sich die Serien in
  # Prometheus/Grafana bei mehreren Deployments sauber unterscheiden lassen
  management.metrics.tags.application=hello-world
