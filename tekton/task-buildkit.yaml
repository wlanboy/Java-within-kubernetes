# Baut service/Dockerfile mit BuildKit (rootless, daemonless) und pusht das Image.
#
# Warum BuildKit statt Kaniko: Das Dockerfile nutzt "RUN --mount=type=cache" und
# "RUN --mount=type=bind,from=git" (Named Build Context fuer .git). Beides kann nur BuildKit.
# Das Gegenstueck zu "docker build --build-context git=.git" ist hier
# "--local git=<pfad> --opt context:git=local:git".
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildkit-build-push
  labels:
    app.kubernetes.io/part-of: helloworld
spec:
  description: Baut ein Image mit BuildKit rootless aus einem Dockerfile und pusht es in eine Registry.
  params:
    - name: image
      description: Image-Name ohne Tag, z. B. docker.io/wlanboy/helloworld
    - name: tag
      description: Haupt-Tag des Images
      default: latest
    - name: commit
      description: Git-Commit-SHA; wenn gesetzt, wird zusaetzlich mit dem Short-SHA (7 Zeichen) getaggt
      default: ""
    - name: context
      description: Build-Kontext relativ zum Workspace "source" (enthaelt das Dockerfile)
      default: service
    - name: build-cpus
      description: Wert fuer ARG BUILD_CPUS im Dockerfile (-XX:ActiveProcessorCount im Maven-Build)
      default: "2"
    - name: buildkit-image
      default: docker.io/moby/buildkit:v0.33.1-rootless
  workspaces:
    - name: source
      description: Ausgecheckter Quellcode inkl. .git
      readOnly: true
    - name: dockerconfig
      description: Secret mit config.json fuer den Registry-Login
      optional: true
      readOnly: true
    - name: buildkit-cache
      description: >-
        BuildKit-State (Layer-Cache und Maven-Cache-Mount /root/.m2).
        emptyDir = kein Cache zwischen Runs, PVC = Cache bleibt erhalten.
      mountPath: /home/user/.local/share/buildkit
      optional: true
  results:
    - name: IMAGE_URL
      description: Gepushtes Image mit Haupt-Tag
    - name: IMAGE_DIGEST
      description: Digest des gepushten Images
  steps:
    - name: build-and-push
      image: $(params.buildkit-image)
      env:
        - name: BUILDKITD_FLAGS
          value: --oci-worker-no-process-sandbox
        - name: IMAGE
          value: $(params.image)
        - name: TAG
          value: $(params.tag)
        - name: COMMIT
          value: $(params.commit)
        - name: CONTEXT_DIR
          value: $(workspaces.source.path)/$(params.context)
        - name: GIT_DIR
          value: $(workspaces.source.path)/.git
        - name: BUILD_CPUS
          value: $(params.build-cpus)
        - name: DOCKERCONFIG_BOUND
          value: $(workspaces.dockerconfig.bound)
        - name: DOCKERCONFIG_PATH
          value: $(workspaces.dockerconfig.path)
      # Rootless BuildKit braucht eigene User-Namespaces, das blockieren die Default-Profile
      # von seccomp und AppArmor. Siehe github.com/moby/buildkit/tree/master/examples/kubernetes
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      script: |
        #!/bin/sh
        set -eu

        if [ "${DOCKERCONFIG_BOUND}" = "true" ]; then
          export DOCKER_CONFIG="${DOCKERCONFIG_PATH}"
        fi

        NAMES="${IMAGE}:${TAG}"
        if [ -n "${COMMIT}" ]; then
          NAMES="${NAMES},${IMAGE}:$(printf '%s' "${COMMIT}" | cut -c1-7)"
        fi

        # Wie "docker build --build-context git=.git": ohne .git bleibt die Stage "git" leer,
        # der Build laeuft dann ohne git.properties durch.
        set --
        if [ -f "${GIT_DIR}/HEAD" ]; then
          set -- --local git="${GIT_DIR}" --opt context:git=local:git
        else
          echo "Kein .git gefunden, baue ohne Git-Infos"
        fi

        echo "Baue ${NAMES}"
        buildctl-daemonless.sh build \
          --frontend dockerfile.v0 \
          --local context="${CONTEXT_DIR}" \
          --local dockerfile="${CONTEXT_DIR}" \
          "$@" \
          --opt build-arg:BUILD_CPUS="${BUILD_CPUS}" \
          --output "type=image,\"name=${NAMES}\",push=true" \
          --metadata-file /tmp/metadata.json

        DIGEST=$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' /tmp/metadata.json)
        printf '%s' "${IMAGE}:${TAG}" > "$(results.IMAGE_URL.path)"
        printf '%s' "${DIGEST}" > "$(results.IMAGE_DIGEST.path)"
        echo "Gepusht: ${IMAGE}:${TAG}@${DIGEST}"
