nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# KEDA ScaledObject: ersetzt die native HorizontalPodAutoscaler-Ressource aus
# chart-hpa. Vorteil gegenueber chart-hpa: KEDA fragt Prometheus direkt per
# PromQL ab, es wird also KEIN custom.metrics.k8s.io Adapter (z.B. Prometheus
# Adapter) mehr benoetigt. minReplicaCount: 0 ("scale to zero") funktioniert
# daher ohne die in chart-hpa noetige Object-Metrik-Umgehung ueber das
# istio-ingressgateway - die PromQL-Query liefert unabhaengig von laufenden
# Pods ein Ergebnis (ggf. 0), das reicht KEDA zum Hochskalieren.
#
# Voraussetzung: der KEDA-Operator muss im Cluster laufen (siehe
# ../keda/keda-setup.md) und fuer den Prometheus-Trigger zusaetzlich der
# Prometheus-Server aus ../prometheus/prometheus-setup.md.
keda:
  enabled: true
  # Wie oft KEDA die Trigger abfragt (Sekunden). Bestimmt u.a. wie schnell von
  # 0 Replicas wieder hochskaliert wird, sobald wieder Traffic ankommt.
  pollingInterval: 30
  # Wie lange nach dem letzten "aktiven" Trigger-Wert gewartet wird, bevor auf
  # minReplicaCount (hier 0) heruntergefahren wird.
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
    cpu:
      enabled: true
      type: Utilization
      value: "70"
    prometheus:
      enabled: true
      # Adresse des Prometheus-Servers aus ../prometheus/ (Service
      # "prometheus-server" im Namespace "prometheus", Port 80 - NICHT 9090,
      # das ist nur der interne targetPort). Istio-ingressgateway laeuft im
      # Namespace "istio-ingress", nicht "istio-system" (das ist nur istiod).
      serverAddress: "http://prometheus-server.prometheus.svc.cluster.local"
      metricName: http_requests_per_second
      # Aggregiert Requests/Sekunde ueber alle Pods hinweg (Object-Metrik,
      # analog zum requestsMetric in chart-hpa), gemessen am
      # istio-ingressgateway statt an den App-Pods, damit die Query auch bei
      # 0 Replicas ein Ergebnis liefert.
      query: >-
        sum(rate(istio_requests_total{destination_service=~"hello-world-keda\\..*"}[1m]))
      threshold: "50"
      # Ab welchem Metrikwert der Trigger ueberhaupt als "aktiv" gilt (siehe
      # cooldownPeriod). "0" heisst: jeder Wert > 0 haelt den Trigger aktiv.
      activationThreshold: "0"
  # behavior steuert, wie schnell/vorsichtig die von KEDA erzeugte HPA-Ressource
  # auf neue Trigger-Werte reagiert - Semantik identisch zum behavior-Block in
  # chart-hpa/values.yaml (siehe dort fuer Details zu
  # stabilizationWindowSeconds/podsPerPeriod/periodSeconds).
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          podsPerPeriod: 2
          periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 60
          podsPerPeriod: 1
          periodSeconds: 30

# Istio Gateway/VirtualService: routet Traffic vom bestehenden
# istio-ingressgateway zu diesem Service. Erzeugt eigene Gateway/VirtualService-
# Objekte (statt die von chart-hpa/templates/gateway.yaml wiederzuverwenden),
# damit chart-keda unabhaengig davon installiert/deinstalliert werden kann.
# Ohne dieses Routing entsteht nie istio_requests_total mit
# destination_service=hello-world-keda..., und der Prometheus-Trigger kann
# nie den ersten Pod aus dem Stand von 0 Replicas wecken (siehe
# keda.triggers.prometheus oben).
istio:
  enabled: true
  host: "hello-world-keda.local"
  # Pod-Label-Selector des istio-ingressgateway-Workloads (per "kubectl get
  # pod -n istio-ingress -l app=istio-ingressgateway --show-labels" verifiziert).
  gatewaySelector:
    istio: ingressgateway

image:
  repository: wlanboy/helloworld
  tag: latest
  pullPolicy: Always

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/actuator/prometheus"

terminationGracePeriodSeconds: 40
automountServiceAccountToken: false

podAntiAffinity:
  enabled: true
  weight: 100

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

ports:
  http: 8080
  management: 8081

env:
  TZ: "Europe/Berlin"
  SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/config/"

javaOpts: >-
  -Djava.security.egd=file:/dev/./urandom
  -XX:+ExitOnOutOfMemoryError
  -XX:MaxRAMPercentage=70.0
  -XX:InitialRAMPercentage=70.0
  -XX:MaxMetaspaceSize=96m
  -XX:MaxDirectMemorySize=32m
  -XX:-UsePerfData
  -XX:+UseSerialGC
  -XX:ActiveProcessorCount=1
  -XX:TieredStopAtLevel=1
  -Dspring.aot.enabled=true

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
    ephemeral-storage: "128Mi"
  limits:
    cpu: "1"
    memory: "512Mi"
    ephemeral-storage: "256Mi"

startupProbe:
  path: /actuator/health/readiness
  port: management
  failureThreshold: 30
  periodSeconds: 2
  timeoutSeconds: 5

readinessProbe:
  path: /actuator/health/readiness
  port: management
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

livenessProbe:
  path: /actuator/health/liveness
  port: management
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

preStopSleepSeconds: 5

# PodDisruptionBudget: begrenzt, wie viele Pods bei freiwilligen Disruptions
# (Node-Drain, Cluster-Autoscaler-Downscale, kubectl evict) gleichzeitig
# entfernt werden duerfen. Schuetzt NICHT vor Pod-Crashes/OOM-Kills, nur vor
# absichtlichen/geplanten Aktionen.
# Skalierung durch KEDA (auch scale-to-zero via minReplicaCount: 0) ist davon
# NICHT betroffen, da der ReplicaSet-Controller die Pods dabei direkt loescht
# und nicht ueber die Eviction-API geht, die die PDB durchsetzt.
# Achtung trotzdem: minAvailable muss kleiner als die aktuelle Replica-Zahl
# sein, sonst wird jede freiwillige Disruption blockiert. Sobald KEDA (z.B.
# nach dem Hochskalieren aus 0) nur 1 Pod faehrt, verhindert minAvailable: 1
# damit jeden Node-Drain dieses einen Pods, bis erneut hochskaliert wurde.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# application.properties Inhalt fuer die ConfigMap (siehe templates/configmap.yaml)
config: |
  # --- Server ---
  server.shutdown=graceful
  server.http2.enabled=true

  # --- Tomcat: klein gehalten, weil der Pod nur 1 CPU-Core zugewiesen bekommt
  # und zusaetzlich ein Istio-Sidecar auf demselben Node/Pod mitlaeuft.
  # server.tomcat.threads.max=200 (Default)
  server.tomcat.threads.max=20
  # server.tomcat.max-connections=8192 (Default)
  server.tomcat.max-connections=512
  # Anzahl der Requests, die in die Warteschlange duerfen, bevor Verbindungen abgelehnt werden
  server.tomcat.accept-count=100
  # Anzahl der Processor-Objekte, die Tomcat zur Wiederverwendung vorhaelt (Default: 200)
  server.tomcat.processor-cache=200
  # Bei threads.max=20 reichen wenige Idle-Threads (Default: 10)
  server.tomcat.threads.min-spare=5

  # --- Timeouts: kurz halten, damit offene Keep-Alive-Verbindungen den graceful shutdown
  # (preStop-sleep von nur 5s, siehe Deployment) nicht verzoegern
  # server.tomcat.connection-timeout=20s (Default)
  server.tomcat.connection-timeout=5s
  server.tomcat.keep-alive-timeout=15s
  # Begrenzt Requests pro Keep-Alive-Verbindung (Default: 100). Bei nur 2 Replicas
  # sorgt ein niedrigerer Wert fuer periodische Reconnects, damit eine einzelne
  # lang gehaltene Verbindung nicht dauerhaft denselben Pod bindet
  server.tomcat.max-keep-alive-requests=50

  # --- Hinter dem Istio-Sidecar: X-Forwarded-* Header vom Spring-Framework auswerten lassen,
  # damit Client-IP/Schema/Host in Logs und generierten URLs korrekt ankommen
  server.forward-headers-strategy=framework

  # --- JMX-Registrierung der Tomcat-MBeans abschalten: spart etwas Startzeit/Speicher,
  # da kein JMX-Monitoring genutzt wird (Metriken laufen ueber Actuator/Prometheus)
  server.tomcat.mbeanregistry.enabled=false

  # --- Graceful shutdown: Zeitfenster muss zum terminationGracePeriodSeconds im Deployment passen ---
  spring.lifecycle.timeout-per-shutdown-phase=30s

  # --- Actuator auf eigenem Port: Health/Metrics/Prometheus sind damit nicht ueber
  # den Kubernetes-Service/Istio erreichbar, sondern nur direkt auf dem Pod (Probes
  # und Prometheus-Scrape gehen an der Pod-IP vorbei am Service) ---
  management.server.port=8081

  # --- Actuator: fuer Kubernetes Liveness-/Readiness-Probes ---
  management.endpoints.web.exposure.include=health,info,prometheus
  management.endpoint.health.probes.enabled=true
  management.health.livenessstate.enabled=true
  management.health.readinessstate.enabled=true
  # verhindert, dass interne Detail-Infos (DB-Status, Disk-Space etc.) ueber
  # /actuator/health nach aussen sichtbar werden, falls der Endpoint doch erreichbar ist
  management.endpoint.health.show-details=never
  # taggt alle Prometheus-Metriken mit dem App-Namen, damit sich die Serien in
  # Prometheus/Grafana bei mehreren Deployments sauber unterscheiden lassen
  management.metrics.tags.application=hello-world
