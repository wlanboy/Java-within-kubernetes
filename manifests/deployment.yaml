apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  labels:
    app: hello-world
spec:
  replicas: 2
  # explizit statt Default (25% auf/ab, rundet bei replicas:2 zufaellig): waehrend
  # des Rollouts darf kein Pod fehlen (maxUnavailable:0), stattdessen kurzzeitig
  # ein dritter Pod zusaetzlich (maxSurge:1) -> Zero-Downtime-Deploy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
      annotations:
        prometheus.io/scrape: "true"
        # eigener Management-Port (siehe configmap.yaml: management.server.port),
        # Prometheus scraped die Pod-IP direkt und geht damit am Service vorbei
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Zeit fuer graceful shutdown (Spring: 30s) + Puffer fuer Istio-Draining
      terminationGracePeriodSeconds: 40
      # App braucht keinen Zugriff auf die Kubernetes-API; Token nicht mounten
      # reduziert die Angriffsflaeche (kein SA-Token im Pod, der bei einem
      # Container-Escape missbraucht werden koennte)
      automountServiceAccountToken: false
      # verhindert, dass beide Replicas auf demselben Node landen: die
      # PodDisruptionBudget (minAvailable:1) schuetzt nur vor freiwilligem
      # Draining, nicht vor einem Node-Ausfall. "preferred" statt "required",
      # damit das Scheduling auch bei wenigen Nodes (z.B. lokal/Test) nicht blockiert
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hello-world
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        # 1000 muss exakt zur UID/GID im Runtime-Image passen (siehe service/Dockerfile,
        # "addgroup -g 1000 ... adduser -u 1000 ..."), sonst schlaegt der Start fehl
        runAsUser: 1000
        # gleiche GID wie runAsUser, damit gemountete Volumes (config/tmp) fuer den
        # Prozess beschreibbar/lesbar sind, ohne dass das Image root braucht
        fsGroup: 1000
        seccompProfile:
          # RuntimeDefault statt Unconfined: nutzt das vom Cluster/Runtime
          # bereitgestellte Standard-Seccomp-Profil als Basis-Haertung
          type: RuntimeDefault
      containers:
        - name: hello-world
          image: wlanboy/helloworld:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # separater Actuator-Port (management.server.port in configmap.yaml):
            # nicht im Service exposed, daher ueber den Kubernetes-Service/Istio
            # nicht erreichbar, nur direkt an der Pod-IP (Probes, Prometheus-Scrape)
            - name: management
              containerPort: 8081
              protocol: TCP
          securityContext:
            # verhindert, dass der Prozess sich selbst mehr Rechte verschafft
            # als der startende User hat (z.B. via setuid-Binaries)
            allowPrivilegeEscalation: false
            # Root-Dateisystem des Containers read-only; einzige Schreibziele
            # sind die explizit gemounteten Volumes config (readOnly) und tmp
            readOnlyRootFilesystem: true
            capabilities:
              # alle Linux-Capabilities entziehen; die JVM/Tomcat braucht keine
              # (kein Bind an Ports < 1024, kein Netzwerk-/Kernel-Zugriff noetig)
              drop: ["ALL"]
          env:
            # laedt optional zusaetzliche Properties aus dem gemounteten ConfigMap-Volume;
            # "optional:" verhindert einen Startfehler, falls die Datei mal fehlt
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "optional:file:/config/"
            # Zeitzone fuer Logs/Timestamps im Container
            - name: TZ
              value: "Europe/Berlin"
            # JAVA_OPTS: JVM-Flags fuer ressourcenschonenden Betrieb im Container.
            # Reihenfolge der Kommentare entspricht der Reihenfolge der Flags im Wert unten:
            #   -Djava.security.egd=file:/dev/./urandom  -> nicht-blockierende Zufallszahlenquelle statt /dev/random (verhindert Startverzoegerung durch Entropie-Mangel)
            #   -XX:+ExitOnOutOfMemoryError               -> Prozess beendet sich sofort bei Heap-OOM statt in kaputtem Zustand weiterzulaufen; Kubernetes startet den Pod neu
            #   -XX:MaxRAMPercentage=70.0                 -> maximale Heap-Groesse als Anteil des Container-Memory-Limits (~358Mi von 512Mi)
            #   -XX:InitialRAMPercentage=70.0             -> initiale Heap-Groesse identisch zum Max, kein Nachvergroessern zur Laufzeit noetig
            #   -XX:MaxMetaspaceSize=96m                  -> deckelt Klassenmetadaten-Speicher (sonst unbegrenzt -> Risiko fuer natives OOM ausserhalb des Heaps)
            #   -XX:MaxDirectMemorySize=32m               -> deckelt NIO-Direct-Buffers (von Tomcat genutzt), verhindert unbemerktes Off-Heap-Wachstum
            #   -XX:-UsePerfData                          -> kein Schreiben von /tmp/hsperfdata_*; passt zu readOnlyRootFilesystem und spart I/O
            #   -XX:+UseSerialGC                          -> Single-Threaded GC passend zu 1 CPU-Core, kein Overhead durch Parallel-/G1-GC-Threads
            #   -XX:ActiveProcessorCount=1                -> JVM sieht nur 1 Core; muss zum CPU-Limit unten passen, sonst ueberschaetzte Thread-Pools/GC-Threads
            #   -XX:TieredStopAtLevel=1                   -> nur C1-Compiler (kein C2); spart CPU/Speicher fuer JIT, passend fuer kleine/kurzlebige Workloads
            #   -Dspring.aot.enabled=true                 -> aktiviert zur Laufzeit die beim Build per spring-boot:process-aot generierten AOT-Metadaten (weniger Reflection/Proxy-Arbeit beim Start -> schnellerer, ressourcenschonenderer Boot)
            - name: JAVA_OPTS
              value: >-
                -Djava.security.egd=file:/dev/./urandom
                -XX:+ExitOnOutOfMemoryError
                -XX:MaxRAMPercentage=70.0
                -XX:InitialRAMPercentage=70.0
                -XX:MaxMetaspaceSize=96m
                -XX:MaxDirectMemorySize=32m
                -XX:-UsePerfData
                -XX:+UseSerialGC
                -XX:ActiveProcessorCount=1
                -XX:TieredStopAtLevel=1
                -Dspring.aot.enabled=true
          # startupProbe faengt langsame erste Requests/Klassenladen ab,
          # ohne dass liveness den Pod waehrend des Starts killt
          # timeoutSeconds hoeher als Default (1s): bei 1 CPU-Core + SerialGC
          # kann eine Stop-the-World-Pause oder kurzer Lastspitzen-Stau den
          # Actuator-Call ueber 1s ziehen, ohne dass das ein echter Fehler ist
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            # failureThreshold 30 x periodSeconds 2s = 60s Startbudget, bevor
            # Kubernetes den Start als fehlgeschlagen wertet und den Pod neu startet
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            # kein Delay noetig: startupProbe hat den langsamen Start bereits abgefangen
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            # nach 3 Fehlschlägen in Folge (~30s) aus dem Service-Endpoint genommen
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            # kein Delay noetig: startupProbe hat den langsamen Start bereits abgefangen
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            # nach 3 Fehlschlägen in Folge (~30s) haelt Kubernetes den Pod fuer
            # nicht mehr reparierbar und startet ihn neu
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # kurze Wartezeit, damit Istio-Sidecar den Pod aus dem
                # Endpoint-Routing nimmt, bevor Tomcat den Shutdown beginnt
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              # niedrig angesetzt fuer engeres Bin-Packing im Node; Burst bis zum
              # Limit (1 Core) fuer Lastspitzen/Start (AOT-Klassenladen, JIT) bleibt moeglich
              cpu: "250m"
              # realistischer Ruhezustands-Verbrauch nach dem Start
              memory: "256Mi"
              # Platz fuer Logs/temporaere Dateien im Normalbetrieb;
              # das Limit (256Mi) deckelt Ausreisser wie Heap-Dumps
              ephemeral-storage: "128Mi"
            limits:
              # 1 Core -> deckt sich mit -XX:ActiveProcessorCount=1; bewusst klein
              # gehalten, damit sich JVM und Istio-Sidecar einen Core teilen
              # koennen, ohne sich gegenseitig zu throtteln
              cpu: "1"
              # Heap (70% von 512Mi ~ 358Mi) + Metaspace (96m) + Direct-Memory (32m)
              # + Thread-Stacks/Code-Cache-Puffer
              memory: "512Mi"
              # deckelt Logs/Heap-Dumps im "tmp" emptyDir (readOnlyRootFilesystem)
              ephemeral-storage: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: hello-world-config
        - name: tmp
          # beschreibbares emptyDir fuer /tmp, noetig weil readOnlyRootFilesystem: true
          # das Root-Dateisystem des Containers schreibgeschuetzt macht
          emptyDir: {}
