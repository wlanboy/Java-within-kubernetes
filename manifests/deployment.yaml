apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  labels:
    app: hello-world
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
      annotations:
        # bewusst kleine Prozess-Anzahl, damit sich JVM und Istio-Sidecar
        # ein Core teilen koennen, ohne sich gegenseitig zu throtteln
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Zeit fuer graceful shutdown (Spring: 30s) + Puffer fuer Istio-Draining
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello-world
          image: wlanboy/helloworld:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # laedt optional zusaetzliche Properties aus dem gemounteten ConfigMap-Volume;
            # "optional:" verhindert einen Startfehler, falls die Datei mal fehlt
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "optional:file:/config/"
            # Zeitzone fuer Logs/Timestamps im Container
            - name: TZ
              value: "Europe/Berlin"
            # JAVA_OPTS: JVM-Flags fuer ressourcenschonenden Betrieb im Container.
            # Reihenfolge der Kommentare entspricht der Reihenfolge der Flags im Wert unten:
            #   -Djava.security.egd=file:/dev/./urandom  -> nicht-blockierende Zufallszahlenquelle statt /dev/random (verhindert Startverzoegerung durch Entropie-Mangel)
            #   -XX:+ExitOnOutOfMemoryError               -> Prozess beendet sich sofort bei Heap-OOM statt in kaputtem Zustand weiterzulaufen; Kubernetes startet den Pod neu
            #   -XX:MaxRAMPercentage=70.0                 -> maximale Heap-Groesse als Anteil des Container-Memory-Limits (~358Mi von 512Mi)
            #   -XX:InitialRAMPercentage=70.0             -> initiale Heap-Groesse identisch zum Max, kein Nachvergroessern zur Laufzeit noetig
            #   -XX:MaxMetaspaceSize=96m                  -> deckelt Klassenmetadaten-Speicher (sonst unbegrenzt -> Risiko fuer natives OOM ausserhalb des Heaps)
            #   -XX:MaxDirectMemorySize=32m               -> deckelt NIO-Direct-Buffers (von Tomcat genutzt), verhindert unbemerktes Off-Heap-Wachstum
            #   -XX:-UsePerfData                          -> kein Schreiben von /tmp/hsperfdata_*; passt zu readOnlyRootFilesystem und spart I/O
            #   -XX:+UseSerialGC                          -> Single-Threaded GC passend zu 1 CPU-Core, kein Overhead durch Parallel-/G1-GC-Threads
            #   -XX:ActiveProcessorCount=1                -> JVM sieht nur 1 Core; muss zum CPU-Limit unten passen, sonst ueberschaetzte Thread-Pools/GC-Threads
            #   -XX:TieredStopAtLevel=1                   -> nur C1-Compiler (kein C2); spart CPU/Speicher fuer JIT, passend fuer kleine/kurzlebige Workloads
            - name: JAVA_OPTS
              value: >-
                -Djava.security.egd=file:/dev/./urandom
                -XX:+ExitOnOutOfMemoryError
                -XX:MaxRAMPercentage=70.0
                -XX:InitialRAMPercentage=70.0
                -XX:MaxMetaspaceSize=96m
                -XX:MaxDirectMemorySize=32m
                -XX:-UsePerfData
                -XX:+UseSerialGC
                -XX:ActiveProcessorCount=1
                -XX:TieredStopAtLevel=1
          # startupProbe faengt langsame erste Requests/Klassenladen ab,
          # ohne dass liveness den Pod waehrend des Starts killt
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # kurze Wartezeit, damit Istio-Sidecar den Pod aus dem
                # Endpoint-Routing nimmt, bevor Tomcat den Shutdown beginnt
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "128Mi"
            limits:
              # 1 Core -> deckt sich mit -XX:ActiveProcessorCount=1
              cpu: "1"
              # Heap (70% von 512Mi ~ 358Mi) + Metaspace (96m) + Direct-Memory (32m)
              # + Thread-Stacks/Code-Cache-Puffer
              memory: "512Mi"
              # deckelt Logs/Heap-Dumps im "tmp" emptyDir (readOnlyRootFilesystem)
              ephemeral-storage: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: hello-world-config
        - name: tmp
          emptyDir: {}
